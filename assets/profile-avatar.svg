<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2b18f" />
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232733" />
      <stop offset="100%" stop-color="#11131a" />
    </linearGradient>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" fill="url(#bg-grad)" />

  <!-- Technical Grid Pattern -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <path d="M 50 0 L 50 400 M 100 0 L 100 400 M 150 0 L 150 400 M 200 0 L 200 400 M 250 0 L 250 400 M 300 0 L 300 400 M 350 0 L 350 400" />
    <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250 M 0 300 L 400 300 M 0 350 L 400 350" />
  </g>

  <!-- Developer Silhouette Artwork -->
  <!-- Shoulders & Hoodie -->
  <path d="M 80 400 C 80 320, 130 290, 200 290 C 270 290, 320 320, 320 400 Z" fill="url(#shirt-grad)" stroke="url(#rim-grad)" stroke-width="2" />
  <path d="M 160 290 Q 200 330 240 290" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />

  <!-- Neck -->
  <rect x="175" y="240" width="50" height="60" rx="8" fill="url(#skin-grad)" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="190" rx="65" ry="75" fill="url(#skin-grad)" />

  <!-- Hair -->
  <path d="M 135 180 C 135 110, 170 100, 200 100 C 235 100, 265 110, 265 180 C 255 140, 240 130, 200 130 C 160 130, 145 145, 135 180 Z" fill="url(#hair-grad)" />

  <!-- Modern Glasses -->
  <rect x="150" y="170" width="38" height="26" rx="6" fill="none" stroke="#38bdf8" stroke-width="3" />
  <rect x="212" y="170" width="38" height="26" rx="6" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 188 180 L 212 180" stroke="#38bdf8" stroke-width="3" />

  <!-- Eyes & Smile -->
  <circle cx="169" cy="183" r="3.5" fill="#1e293b" />
  <circle cx="231" cy="183" r="3.5" fill="#1e293b" />
  <path d="M 185 220 Q 200 232 215 220" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Glowing Code Elements in Background -->
  <g font-family="monospace" font-size="14" fill="#38bdf8" opacity="0.6">
    <text x="35" y="90">&lt;coder /&gt;</text>
    <text x="290" y="90">{ 9.31 }</text>
    <text x="30" y="270">AI / ML</text>
    <text x="310" y="270">React.js</text>
  </g>
</svg>
